  rect(-50,-100,100,140,trailer);rect(-45,40,90,55,cab);
  rect(-34,66,68,22,'#809980');rect(-40,90,12,6,'#fff299');rect(28,90,12,6,'#fff299');
  circ(-20,-40,8,'#801a1a');circ(24,-8,6,'#801a1a');
  // zombie alla guida
  circ(-14,76,8,'#739950');circ(14,76,8,'#739950');
  circ(-16,74,2,'#e01a1a');circ(-11,74,2,'#e01a1a');circ(12,74,2,'#e01a1a');circ(17,74,2,'#e01a1a');
  ctx.restore();
}

// ---------- Particelle / effetti ----------
function explode(x,y,n,cols,spd){
  for(var i=0;i<n;i++){var a=rnd(0,6.283),v=rnd(30,spd||170);
    st.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.5,1.1),max:1.1,col:cols[i%cols.length],sz:rnd(2,4.5)});}
}
var FIRE_LAND=['#f0902a','#f2b040','#d0601e','#ffd860'],FIRE_SEA=['#4f7a6b','#7ab0a1','#bfeaff','#d9f4ff'],FIRE=(st.zone===5)?FIRE_SEA:FIRE_LAND;
function floatText(s,x,y,col,sz){st.texts.push({s:s,x:x,y:y,t:0,col:col||'#FFD84A',sz:sz||14});}

// ---------- Input ----------
var drag=null;
var btnCTA=null,btnRetry=null,btnGet=null;
function toLocal(ev){var r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-OX)/S,y:(ev.clientY-r.top)/S};}
function inBtn(p,b){return b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
cv.addEventListener('pointerdown',function(ev){
  ev.preventDefault();var p=toLocal(ev);
  if(st.end){
    if(st.endT>0.6&&inBtn(p,btnRetry)){reset();return;}
    if(st.endT>0.6)cta();
    return;
  }
  if(inBtn(p,btnGet)){cta();return;}
  st.touched=true;drag={sx:p.x,spx:st.px};st.tx=st.px;
},{passive:false});
cv.addEventListener('pointermove',function(ev){
  if(!drag||st.end)return;var p=toLocal(ev);
  st.tx=drag.spx+(p.x-drag.sx)*1.3;
});
window.addEventListener('pointerup',function(){drag=null;});
window.addEventListener('pointercancel',function(){drag=null;});

// ---------- Logica ----------
var PY=function(){return H-150;};
function hurt(){
  if(st.inv>0||st.hearts<=0)return;
  if(!st.touched)return;            // demo automatica: nessun danno
  st.hearts--;st.inv=1.2;st.shake=0.35;explode(st.px,PY(),18,FIRE,140);
  if(st.hearts<=0){st.deadT=0.001;st.ebullets.length=0;st.bullets.length=0;st.laser=0;explode(st.px,PY(),60,FIRE.concat(['#b8322a','#80542e']),220);}
}
function spawnCar(){
  var y=-45,c=cx(y);
  st.enemies.push({x:c+rnd(-1,1)*(RH-30),y:y,vy:rnd(95,140),hp:3,flash:0,col:CAR_COLS[(Math.random()*CAR_COLS.length)|0],
                   shooter:Math.random()<0.35,shootT:rnd(0.5,1.4),kind:SEA_KINDS[(Math.random()*4)|0]});
}
function fireAt(x,y,speed){
  var dx=st.px-x,dy=PY()-y,d=Math.sqrt(dx*dx+dy*dy)||1;
  st.ebullets.push({x:x,y:y,vx:dx/d*speed,vy:dy/d*speed});
}
function autopilot(){
  var target=W/2,i;
  if(st.pickups.length)target=st.pickups[0].x;
  else if(st.boss)target=st.boss.x+Math.sin(st.t*2)*18;
  else{var best=null,bd=1e9;for(i=0;i<st.enemies.length;i++){var e=st.enemies[i];if(e.y<PY()-90&&e.y>0){var d=Math.abs(e.x-st.px)+(PY()-e.y)*0.3;if(d<bd){bd=d;best=e;}}}if(best)target=best.x;}
  for(i=0;i<st.ebullets.length;i++){var b=st.ebullets[i];if(b.y<PY()&&b.y>PY()-140&&Math.abs(b.x-target)<26)target+=(b.x<target?44:-44);}
  for(i=0;i<st.enemies.length;i++){var e2=st.enemies[i];if(e2.y>PY()-150&&e2.y<PY()+40&&Math.abs(e2.x-target)<40)target+=(e2.x<target?50:-50);}
  st.tx=target;
}
function update(dt){
  st.t+=dt;
  var endSlow=st.end?0.25:1;
  st.travel+=SCROLL*dt*endSlow;
  if(st.shake>0)st.shake-=dt;
  // particelle e testi sempre animati
  for(var i=st.parts.length-1;i>=0;i--){var p=st.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt+SCROLL*dt*0.5*endSlow;p.vx*=0.96;p.vy*=0.96;p.life-=dt;if(p.life<=0)st.parts.splice(i,1);}
  for(i=st.texts.length-1;i>=0;i--){var tt=st.texts[i];tt.t+=dt;tt.y-=30*dt;if(tt.t>1.3)st.texts.splice(i,1);}
  if(st.end){st.endT+=dt;return;}
  if(st.deadT>0){st.deadT+=dt;if(st.deadT>1.2)endGame('lose');return;}
  if(st.boss&&st.boss.dead){st.boss.deadT+=dt;if(st.boss.deadT>1.8)endGame('win');}
  if(st.t>45)endGame('lose');

  // guida
  if(!st.touched)autopilot();
  var py=PY(),c=cx(py),lim=RH-20;
  st.tx=Math.max(c-lim,Math.min(c+lim,st.tx));
  var dx=st.tx-st.px,mv=520*dt;st.px+=Math.abs(dx)<mv?dx:Math.sign(dx)*mv;
  st.px=Math.max(c-lim,Math.min(c+lim,st.px));
  if(st.inv>0)st.inv-=dt;
  st.hintT+=dt;

  // fuoco automatico (2 cannoni)
  st.fireT-=dt;
  if(st.fireT<=0){st.fireT=0.12;st.bullets.push({x:st.px-8,y:py-36},{x:st.px+8,y:py-36});}
  for(i=st.bullets.length-1;i>=0;i--){var bl=st.bullets[i];bl.y-=480*dt;if(bl.y<-20)st.bullets.splice(i,1);}

  // tempistica: laser, boss
  if(!st.laserDone[0]&&st.t>5.5){st.laserDone[0]=true;st.pickups.push({x:cx(-20),y:-20});}
  if(!st.bossWarn&&st.t>11){st.bossWarn=true;floatText(st.zone===5?TX.bossSea:TX.boss,W/2,H*0.35,'#ff5040',16);st.shake=0.2;}
  if(!st.boss&&st.t>12.5){st.boss={x:W/2,y:-90,hp:70,max:70,flash:0,shootT:1.6,dead:false,deadT:0,ph:0};}
  if(st.boss&&!st.laserDone[1]&&(st.boss.hp<st.boss.max*0.55||st.t>19)&&st.laser<=0){st.laserDone[1]=true;st.pickups.push({x:cx(-20)+rnd(-40,40),y:-20});}

  // nemici
  st.spawnT-=dt;
  if(st.spawnT<=0&&!(st.boss&&st.boss.dead)){st.spawnT=st.boss?2.2:(st.t<4?1.0:0.75);if(st.t<11||st.boss)spawnCar();}
  for(i=st.enemies.length-1;i>=0;i--){
    var e=st.enemies[i];e.y+=e.vy*dt;if(e.flash>0)e.flash-=dt;
    if(e.shooter&&e.y>30&&e.y<H*0.55){e.shootT-=dt;if(e.shootT<=0){e.shootT=1.6;fireAt(e.x,e.y+25,165);}}
    if(Math.abs(e.x-st.px)<32&&Math.abs(e.y-py)<50){
      if(st.touched){hurt();}
      killEnemy(i);continue;
    }
    if(e.y>H+60)st.enemies.splice(i,1);
  }
  // collisioni proiettili
  for(i=st.bullets.length-1;i>=0;i--){
    var b=st.bullets[i],hit=false;
    for(var j=st.enemies.length-1;j>=0;j--){var en=st.enemies[j];
      if(Math.abs(b.x-en.x)<20&&Math.abs(b.y-en.y)<30){en.hp--;en.flash=0.05;hit=true;if(en.hp<=0)killEnemy(j);break;}}
    if(!hit&&st.boss&&!st.boss.dead&&Math.abs(b.x-st.boss.x)<36&&b.y>st.boss.y-62&&b.y<st.boss.y+60){hit=true;damageBoss(1);}
    if(hit)st.bullets.splice(i,1);
  }
  // laser
  if(st.laser>0){
    st.laser-=dt;
    for(i=st.enemies.length-1;i>=0;i--){var el=st.enemies[i];if(el.y<py&&Math.abs(el.x-st.px)<26){el.hp-=30*dt;el.flash=0.05;if(el.hp<=0)killEnemy(i);}}
    if(st.boss&&!st.boss.dead&&Math.abs(st.boss.x-st.px)<40)damageBoss(22*dt);
  }
  // pick-up laser
  for(i=st.pickups.length-1;i>=0;i--){
    var pk=st.pickups[i];pk.y+=SCROLL*1.15*dt;
    var ddx=st.px-pk.x,ddy=py-pk.y;
    if(Math.abs(ddx)<90&&ddy<160&&ddy>-20){pk.x+=ddx*3*dt;}
    if(Math.abs(ddx)<30&&Math.abs(ddy)<34){st.pickups.splice(i,1);st.laser=3.2;floatText(TX.laser,st.px,py-60,'#8ce0f0',16);continue;}
    if(pk.y>H+30)st.pickups.splice(i,1);
  }
  // boss
  var bs=st.boss;
  if(bs&&!bs.dead){
    bs.ph+=dt;bs.y=Math.min(bs.y+70*dt,105);
    var amp=Math.min(95,W/2-50);bs.x=W/2+Math.sin(bs.ph*1.1)*amp;
    if(bs.flash>0)bs.flash-=dt;
    if(bs.y>=100){bs.shootT-=dt;if(bs.shootT<=0){bs.shootT=1.4;
      var ox=bs.x,oy=bs.y+58,ddx2=st.px-ox,ddy2=py-oy,base=Math.atan2(ddy2,ddx2);
      for(var k=0;k<3;k++){var a=base+(k-1)*0.28;st.ebullets.push({x:ox,y:oy,vx:Math.cos(a)*150,vy:Math.sin(a)*150});}}}
    if(Math.abs(bs.x-st.px)<40&&Math.abs(bs.y-py)<90)hurt();
  }
  // proiettili nemici
  for(i=st.ebullets.length-1;i>=0;i--){
    var eb=st.ebullets[i];eb.x+=eb.vx*dt;eb.y+=eb.vy*dt;
    if(Math.abs(eb.x-st.px)<16&&Math.abs(eb.y-py)<26){st.ebullets.splice(i,1);hurt();continue;}
    if(eb.y>H+20||eb.y<-30||eb.x<-20||eb.x>W+20)st.ebullets.splice(i,1);
  }
}
function killEnemy(i){var e=st.enemies[i];explode(e.x,e.y,26,FIRE);st.kills++;st.enemies.splice(i,1);}
function damageBoss(d){
  var b=st.boss;b.hp-=d;b.flash=0.05;
  if(b.hp<=0&&!b.dead){b.dead=true;b.deadT=0;st.shake=0.6;
    explode(b.x,b.y,120,['#6b8040','#4d5c2e','#f0902a','#ffd860'],240);
    for(var k=0;k<5;k++)setTimeout(function(){if(!st.boss)return;explode(st.boss.x+rnd(-80,80),st.boss.y+rnd(-40,140),40,['#ff4060','#40c0ff','#ffd840','#80ff60','#ffffff'],200);},k*280);
    st.ebullets.length=0;st.bullets.length=0;st.laser=0;
    for(var j=st.enemies.length-1;j>=0;j--)killEnemy(j);
  }
}
function endGame(kind){if(st.end)return;st.end=kind;st.endT=0;st.ebullets.length=0;st.bullets.length=0;st.laser=0;}

// ---------- Disegno ----------
function drawHeart(x,y,on){
  var c=on?'#e0282d':'#3a3a3a',h=on?'#ff7a7a':'#555';
  rect(x+2,y,4,2,c);rect(x+8,y,4,2,c);rect(x,y+2,14,6,c);rect(x+2,y+8,10,2,c);rect(x+4,y+10,6,2,c);rect(x+6,y+12,2,2,c);rect(x+2,y+2,2,2,h);
}
function drawButton(b,label,sz,pulse){
  ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);var s=1+(pulse||0);ctx.scale(s,s);
  rect(-b.w/2-4,-b.h/2-4,b.w+8,b.h+8,'#000');rect(-b.w/2,-b.h/2,b.w,b.h,'#FFD84A');
  rect(-b.w/2+4,-b.h/2+4,b.w-8,b.h-8,'#C0282D');rect(-b.w/2+4,-b.h/2+4,b.w-8,4,'#e0484d');
  var fs=fitSize(label,b.w-20,sz);text(label,0,2,fs,'#fff',true);
  ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);rect(0,0,cv.width,cv.height,'#0d1a0f');
  ctx.setTransform(S*DPR,0,0,S*DPR,OX*DPR,0);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(st.shake>0)ctx.translate(rnd(-4,4),rnd(-4,4));
  drawRoad();
  var py=PY(),i;
  // pick-up laser
  for(i=0;i<st.pickups.length;i++){var pk=st.pickups[i],gl=0.5+0.5*Math.sin(st.t*10);
    circ(pk.x,pk.y,18+gl*3,'rgba(120,210,240,0.25)');circ(pk.x,pk.y,14,'#1d2a36');
    ctx.lineWidth=3;ctx.strokeStyle='#8ce0f0';ctx.beginPath();ctx.arc(pk.x,pk.y,14,0,6.283);ctx.stroke();
    poly([pk.x+2,pk.y-10,pk.x-6,pk.y+2,pk.x-1,pk.y+2,pk.x-3,pk.y+10,pk.x+6,pk.y-2,pk.x+1,pk.y-2],'#bff2ff');}
  for(i=0;i<st.enemies.length;i++){if(st.zone===5)drawSea(st.enemies[i]);else drawZCar(st.enemies[i]);}
  if(st.boss&&!st.boss.dead){if(st.zone===5)drawWhale(st.boss);else drawBoss(st.boss);}
  // proiettili giocatore
  ctx.fillStyle='#f2d933';for(i=0;i<st.bullets.length;i++)ctx.fillRect(st.bullets[i].x-1.5,st.bullets[i].y-5,3,10);
  // laser
  if(st.laser>0&&!st.end&&st.deadT===0){var lw=8+Math.sin(st.t*40)*1.5;
    rect(st.px-lw,0,lw*2,py-34,'rgba(140,215,225,0.3)');rect(st.px-lw/2,0,lw,py-34,'#8cd7e1');rect(st.px-1.5,0,3,py-34,'#e8fbff');}
  // giocatore
  if(st.deadT===0&&!(st.inv>0&&Math.floor(st.t*14)%2===0)){if(st.zone===5)drawDiver(st.px,py,0.95);else drawPickup(st.px,py,0.9,false);}
  // proiettili nemici (palle di fuoco con scia)
  for(i=0;i<st.ebullets.length;i++){var b=st.ebullets[i];
    ctx.strokeStyle='rgba(232,80,30,0.45)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(b.x-b.vx*0.09,b.y-b.vy*0.09);ctx.lineTo(b.x,b.y);ctx.stroke();
    circ(b.x,b.y,6.5,'#e8401a');circ(b.x,b.y,4,'#ffe08a');}
  // particelle
  for(i=0;i<st.parts.length;i++){var p=st.parts[i];ctx.globalAlpha=Math.max(0,Math.min(1,p.life/0.5));ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.sz,p.sz);}
  ctx.globalAlpha=1;
  // testi volanti
  for(i=0;i<st.texts.length;i++){var tt=st.texts[i];ctx.globalAlpha=Math.max(0,1-tt.t/1.3);var fs=fitSize(tt.s,W-24,tt.sz);text(tt.s,Math.max(W/2-(W/2-12),Math.min(tt.x,W-12)),tt.y,fs,tt.col,true);}
  ctx.globalAlpha=1;
  ctx.restore();
  if(!st.end)drawHUD();else drawEnd();
}
function drawHUD(){
  for(var i=0;i<3;i++)drawHeart(10+i*20,12,i<st.hearts);
  // zombie abbattuti
  circ(18,42,7,'#739950');circ(15,41,1.6,'#e01a1a');circ(21,41,1.6,'#e01a1a');
  text('x'+st.kills,30,43,10,'#fff',true,'left');
  // pulsante download sempre visibile
  var fs=fitSize(TX.get,70,9);font(fs);var bw=Math.max(78,ctx.measureText(TX.get).width+20);
  btnGet={x:W-bw-10,y:10,w:bw,h:28};
  rect(btnGet.x-2,btnGet.y-2,btnGet.w+4,btnGet.h+4,'#000');rect(btnGet.x,btnGet.y,btnGet.w,btnGet.h,'#FFD84A');
  rect(btnGet.x+2,btnGet.y+2,btnGet.w-4,btnGet.h-4,'#C0282D');text(TX.get,btnGet.x+btnGet.w/2,btnGet.y+15,fs,'#fff',false);
  // barra vita del boss
  if(st.boss&&!st.boss.dead&&st.boss.y>0){var bw2=W-140,r=Math.max(0,st.boss.hp/st.boss.max);
    rect(70,48,bw2,10,'#000');rect(72,50,(bw2-4)*r,6,'#e0282d');}
  // tutorial: mano che trascina
  if(!st.touched){
    var a=Math.min(1,st.hintT*2),hx=W/2+Math.sin(st.t*3.2)*70,hy=H-48;
    ctx.globalAlpha=a*(0.85+0.15*Math.sin(st.t*6));
    rect(0,H-92,W,92,'rgba(0,0,0,0.55)');
    var fs2=fitSize(TX.hint,W-30,12);text(TX.hint,W/2,H-74,fs2,'#FFD84A',true);
    // mano stilizzata
    circ(hx,hy+6,11,'#f2d2b6');rect(hx-3,hy-20,7,22,'#f2d2b6');rect(hx-3,hy-20,7,3,'#fff');
    ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(hx-3,hy-20,7,22);
    ctx.beginPath();ctx.arc(hx,hy+6,11,0,6.283);ctx.stroke();
    ctx.globalAlpha=1;
  }
}
function drawEnd(){
  var a=Math.min(1,st.endT/0.5);
  ctx.fillStyle='rgba(8,12,8,'+(0.78*a)+')';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=a;
  var y0=H*0.13;
  text('CHOP & RUN',W/2,y0,fitSize('CHOP & RUN',W-40,26),'#FFD84A',true);
  text('ZOMBIE ROAD',W/2,y0+36,fitSize('ZOMBIE ROAD',W-40,24),'#FFD84A',true);
  var res=st.end==='win'?TX.win:TX.lose,sub=st.end==='win'?TX.subWin:TX.subLose;
  text(res,W/2,H*0.29,fitSize(res,W-30,18),st.end==='win'?'#80ff70':'#ff6050',true);
  text(sub,W/2,H*0.29+28,fitSize(sub,W-30,9),'#e8e8e8',true);
  // pick-up grande che "corre"
  var bob=Math.sin(st.t*8)*2;
  for(var k=0;k<4;k++)rect(W/2-36+k*24,H*0.47+70+((st.t*160+k*30)%40),3,10,'rgba(242,217,51,0.6)');
  drawPickup(W/2,H*0.47+bob,1.9,false);
  // CTA
  var bw=Math.min(270,W-50);btnCTA={x:(W-bw)/2,y:H*0.66,w:bw,h:58};
  drawButton(btnCTA,TX.cta,18,0.04*Math.sin(st.t*6));
  text(TX.free,W/2,btnCTA.y+btnCTA.h+26,fitSize(TX.free,W-30,10),'#ffffff',true);
  // riprova
  var rs=fitSize(TX.retry,W-60,10);font(rs);var rw=ctx.measureText(TX.retry).width+24;
  btnRetry={x:W/2-rw/2-30,y:H*0.88-22,w:rw+60,h:44};
  text(TX.retry,W/2,H*0.88,rs,'#aaaaaa',true);
  rect(W/2-rw/2+12,H*0.88+9,rw-24,2,'#888');
  ctx.globalAlpha=1;
}

// ---------- Ciclo principale ----------
var last=0;
function frame(ts){
  var dt=Math.min(0.033,(ts-last)/1000||0.016);last=ts;
  if(!window.__paused){update(dt);draw();}requestAnimationFrame(frame);
}
function start(){last=performance.now();requestAnimationFrame(frame);}
var started=false;function go(){if(!started){started=true;start();}}
try{document.fonts.load('16px PS2P').then(go,go);}catch(e){go();}
setTimeout(go,1500);
})();
</script>
